name: GateLink Production & Staging Deployment

on:
  push:
    branches:
      - main
      - develop

jobs:
  detect-changes:
    name: Detect Changed Applications
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      society_admin: ${{ steps.filter.outputs.society_admin }}
      super_admin: ${{ steps.filter.outputs.super_admin }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            website:
              - 'Application/Frontend/website/**'
              - 'Application/firebase.json'
              - 'Application/.firebaserc'
              - '.github/workflows/**'
            society_admin:
              - 'Application/Frontend/society_admin/**'
              - 'Application/firebase.json'
              - 'Application/.firebaserc'
              - '.github/workflows/**'
            super_admin:
              - 'Application/Frontend/super_admin/**'
              - 'Application/firebase.json'
              - 'Application/.firebaserc'
              - '.github/workflows/**'
            api:
              - 'Application/Backend/**'
              - 'Application/firebase.json'
              - 'Application/.firebaserc'
              - '.github/workflows/**'

  deploy-website:
    name: Build & Deploy Website
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Application/Frontend/website/package-lock.json'

      - name: Install Dependencies
        run: |
          cd Application/Frontend/website
          npm install

      - name: Build Website Production Bundle
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          cd Application/Frontend/website
          npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_PROD || 'AIzaSyAEqP0hDR5zhpflZ7zTgwk5RxSulpyEwtA' }}
          VITE_FIREBASE_AUTH_DOMAIN: "societysphere-b2538.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "societysphere-b2538"
          VITE_FIREBASE_STORAGE_BUCKET: "societysphere-b2538.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "43273653500"
          VITE_FIREBASE_APP_ID: "1:43273653500:web:9c2c8c55c64a7b7f8f9b79"
          VITE_FIREBASE_MEASUREMENT_ID: "G-V5C3WYBEXT"

      - name: Build Website Staging Bundle
        if: ${{ github.ref == 'refs/heads/develop' }}
        run: |
          cd Application/Frontend/website
          npm run build:staging
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_STAGING || 'AIzaSyCkIVqNPPGVR-HY8wsU-Ik8F79ZkFEocbc' }}
          VITE_FIREBASE_AUTH_DOMAIN: "gatelink-staging.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "gatelink-staging"
          VITE_FIREBASE_STORAGE_BUCKET: "gatelink-staging.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1049080808619"
          VITE_FIREBASE_APP_ID: "1:1049080808619:web:e1bdf99240beef10c9a3ee"
          VITE_FIREBASE_MEASUREMENT_ID: "G-L2MEE3HKKN"

      - name: Deploy to Firebase Hosting Production (societysphere-b2538)
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOCIETYSPHERE_B2538 }}'
          target: website
          channelId: live
          projectId: societysphere-b2538
          entryPoint: Application

      - name: Deploy to Firebase Hosting Staging (gatelink-staging)
        if: ${{ github.ref == 'refs/heads/develop' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GATELINK_STAGING }}'
          target: website
          channelId: live
          projectId: gatelink-staging
          entryPoint: Application

  deploy-society-admin:
    name: Build & Deploy Society Admin
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.society_admin == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Application/Frontend/society_admin/package-lock.json'

      - name: Install Dependencies
        run: |
          cd Application/Frontend/society_admin
          npm install

      - name: Build Society Admin Production Bundle
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          cd Application/Frontend/society_admin
          npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_PROD || 'AIzaSyAEqP0hDR5zhpflZ7zTgwk5RxSulpyEwtA' }}
          VITE_FIREBASE_AUTH_DOMAIN: "societysphere-b2538.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "societysphere-b2538"
          VITE_FIREBASE_STORAGE_BUCKET: "societysphere-b2538.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "43273653500"
          VITE_FIREBASE_APP_ID: "1:43273653500:web:9c2c8c55c64a7b7f8f9b79"
          VITE_FIREBASE_MEASUREMENT_ID: "G-V5C3WYBEXT"

      - name: Build Society Admin Staging Bundle
        if: ${{ github.ref == 'refs/heads/develop' }}
        run: |
          cd Application/Frontend/society_admin
          npm run build:staging
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_STAGING || 'AIzaSyCkIVqNPPGVR-HY8wsU-Ik8F79ZkFEocbc' }}
          VITE_FIREBASE_AUTH_DOMAIN: "gatelink-staging.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "gatelink-staging"
          VITE_FIREBASE_STORAGE_BUCKET: "gatelink-staging.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1049080808619"
          VITE_FIREBASE_APP_ID: "1:1049080808619:web:9047e574dde852e1c9a3ee"
          VITE_FIREBASE_MEASUREMENT_ID: "G-6MTZW8CF1B"

      - name: Deploy to Firebase Hosting Production (societysphere-b2538)
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOCIETYSPHERE_B2538 }}'
          target: society_admin
          channelId: live
          projectId: societysphere-b2538
          entryPoint: Application

      - name: Deploy to Firebase Hosting Staging (gatelink-staging)
        if: ${{ github.ref == 'refs/heads/develop' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GATELINK_STAGING }}'
          target: society_admin
          channelId: live
          projectId: gatelink-staging
          entryPoint: Application

  deploy-super-admin:
    name: Build & Deploy Super Admin
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.super_admin == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Application/Frontend/super_admin/package-lock.json'

      - name: Install Dependencies
        run: |
          cd Application/Frontend/super_admin
          npm install

      - name: Build Super Admin Production Bundle
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          cd Application/Frontend/super_admin
          npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_PROD || 'AIzaSyAEqP0hDR5zhpflZ7zTgwk5RxSulpyEwtA' }}
          VITE_FIREBASE_AUTH_DOMAIN: "societysphere-b2538.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "societysphere-b2538"
          VITE_FIREBASE_STORAGE_BUCKET: "societysphere-b2538.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "43273653500"
          VITE_FIREBASE_APP_ID: "1:43273653500:web:9c2c8c55c64a7b7f8f9b79"
          VITE_FIREBASE_MEASUREMENT_ID: "G-V5C3WYBEXT"

      - name: Build Super Admin Staging Bundle
        if: ${{ github.ref == 'refs/heads/develop' }}
        run: |
          cd Application/Frontend/super_admin
          npm run build:staging
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_STAGING || 'AIzaSyCkIVqNPPGVR-HY8wsU-Ik8F79ZkFEocbc' }}
          VITE_FIREBASE_AUTH_DOMAIN: "gatelink-staging.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "gatelink-staging"
          VITE_FIREBASE_STORAGE_BUCKET: "gatelink-staging.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1049080808619"
          VITE_FIREBASE_APP_ID: "1:1049080808619:web:9047e574dde852e1c9a3ee"
          VITE_FIREBASE_MEASUREMENT_ID: "G-6MTZW8CF1B"

      - name: Deploy to Firebase Hosting Production (societysphere-b2538)
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOCIETYSPHERE_B2538 }}'
          target: super_admin
          channelId: live
          projectId: societysphere-b2538
          entryPoint: Application

      - name: Deploy to Firebase Hosting Staging (gatelink-staging)
        if: ${{ github.ref == 'refs/heads/develop' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GATELINK_STAGING }}'
          target: super_admin
          channelId: live
          projectId: gatelink-staging
          entryPoint: Application

  deploy-api:
    name: Deploy API Gateway
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting Production (societysphere-b2538)
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOCIETYSPHERE_B2538 }}'
          target: api
          channelId: live
          projectId: societysphere-b2538
          entryPoint: Application

      - name: Deploy to Firebase Hosting Staging (gatelink-staging)
        if: ${{ github.ref == 'refs/heads/develop' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GATELINK_STAGING }}'
          target: api
          channelId: live
          projectId: gatelink-staging
          entryPoint: Application

  deploy-firestore-rules:
    name: Deploy Firestore Security Rules
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Rules to Production (societysphere-b2538)
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules --project societysphere-b2538
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOCIETYSPHERE_B2538 }}
          PROJECT_PATH: Application

      - name: Deploy Rules to Staging (gatelink-staging)
        if: ${{ github.ref == 'refs/heads/develop' }}
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules --project gatelink-staging
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GATELINK_STAGING }}
          PROJECT_PATH: Application

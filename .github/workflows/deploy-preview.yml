name: GateLink PR Preview Deployment

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  detect-changes:
    name: Detect Changed Applications
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      society_admin: ${{ steps.filter.outputs.society_admin }}
      super_admin: ${{ steps.filter.outputs.super_admin }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            website:
              - 'Application/Frontend/website/**'
              - 'Application/firebase.json'
            society_admin:
              - 'Application/Frontend/society_admin/**'
              - 'Application/firebase.json'
            super_admin:
              - 'Application/Frontend/super_admin/**'
              - 'Application/firebase.json'

  preview-website:
    name: Preview Website PR
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        run: |
          cd Application/Frontend/website
          npm install
          npm run build

      - name: Deploy PR Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOCIETYSPHERE_B2538 }}'
          target: website
          projectId: societysphere-b2538
          entryPoint: Application

  preview-society-admin:
    name: Preview Society Admin PR
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.society_admin == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        run: |
          cd Application/Frontend/society_admin
          npm install
          npm run build

      - name: Deploy PR Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOCIETYSPHERE_B2538 }}'
          target: society_admin
          projectId: societysphere-b2538
          entryPoint: Application

  preview-super-admin:
    name: Preview Super Admin PR
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.super_admin == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        run: |
          cd Application/Frontend/super_admin
          npm install
          npm run build

      - name: Deploy PR Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOCIETYSPHERE_B2538 }}'
          target: super_admin
          projectId: societysphere-b2538
          entryPoint: Application

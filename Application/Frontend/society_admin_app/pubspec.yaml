name: society_admin_app
description: "GateLink Society Admin & Management Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management - Riverpod
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Firebase Suite
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  cloud_functions: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_storage: ^12.0.0

  # Storage & Preferences
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.2.2

  # UI, Fonts & Assets
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  badges: ^3.1.2
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

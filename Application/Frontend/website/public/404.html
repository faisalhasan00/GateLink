<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | GateLink</title>
    <meta name="description" content="The page you are looking for does not exist or has been moved on GateLink." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://gatelink.in/404" />
    <style>
      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: #020617;
        color: #F8FAFC;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        width: 100%;
        background: #0F172A;
        padding: 48px 32px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      h1 {
        font-family: 'Manrope', sans-serif;
        font-size: 34px;
        font-weight: 900;
        margin-top: 16px;
        margin-bottom: 12px;
        color: #FFFFFF;
      }
      p {
        font-size: 15px;
        color: #94A3B8;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 12px;
        background: #1E3A8A;
        color: #FFFFFF;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        box-shadow: 0 4px 14px rgba(30, 58, 138, 0.35);
      }
    </style>

  <body>
    <div class="card">
      <div style="font-size: 48px;">🛡️</div>
      <h1>404 — Page Not Found</h1>

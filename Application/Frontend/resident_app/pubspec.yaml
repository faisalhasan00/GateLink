name: societysphere
description: GateLink Resident App - Smart Society Resident Mobile App
publish_to: 'none'
version: 1.0.12+13

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management - Riverpod (industry standard)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # HTTP & Networking
  http: ^1.2.0
  dio: ^5.4.3+1
  retrofit: ^4.1.0

  # Secure Storage (for tokens)
  flutter_secure_storage: ^9.2.2

  # Local Storage
  shared_preferences: ^2.3.1

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # OTP & PIN Input
  pinput: ^5.0.0

  # Image & File Picker
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Firebase & Backend
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  cloud_functions: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_storage: ^12.0.0
  firebase_crashlytics: ^4.0.1
  firebase_app_check: ^0.3.0+1
  flutter_local_notifications: ^17.2.2

  # Date & Time
  intl: ^0.20.2

  # Form Validation
  reactive_forms: ^17.0.1

  # Bottom Sheet & Dialogs
  modal_bottom_sheet: ^3.0.0

  # Charts
  fl_chart: ^0.68.0

  # URL Launcher
  url_launcher: ^6.3.0

  # Permission Handler
  permission_handler: ^11.3.1

  # Connectivity
  connectivity_plus: ^6.0.3

  # Refresh Indicator (pull to refresh)
  easy_refresh: ^3.4.0

  # Badges
  badges: ^3.1.2
  google_sign_in: ^6.2.1

  # Sharing
  share_plus: ^12.0.2
  path_provider: ^2.1.3
  flutter_cashfree_pg_sdk: ^2.4.0+52

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

name: societysphere
description: SocietySphere - Smart Society Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management - Riverpod (industry standard)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # HTTP & Networking
  dio: ^5.4.3+1
  retrofit: ^4.1.0

  # Secure Storage (for tokens)
  flutter_secure_storage: ^9.2.2

  # Local Storage
  shared_preferences: ^2.3.1

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # OTP & PIN Input
  pinput: ^5.0.0

  # Image Picker
  image_picker: ^1.1.2
  firebase_storage: ^12.4.10

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Notifications & Backend
  firebase_core: ^3.15.2
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # Date & Time
  intl: ^0.20.2

  # Form Validation
  reactive_forms: ^17.0.1

  # Bottom Sheet & Dialogs
  modal_bottom_sheet: ^3.0.0

  # Charts
  fl_chart: ^0.68.0

  # URL Launcher
  url_launcher: ^6.3.0

  # Permission Handler
  permission_handler: ^11.3.1

  # Connectivity
  connectivity_plus: ^6.0.3

  # Refresh Indicator (pull to refresh)
  easy_refresh: ^3.4.0

  # Badges
  badges: ^3.1.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  google_sign_in: ^6.2.1

  # Sharing
  share_plus: ^12.0.2
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
